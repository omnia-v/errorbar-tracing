name: publish
# Release = push a tag:  js-v0.2.0  publishes @error-bar/tracing to npm,
#                        py-v0.2.0  publishes errorbar-tracing to PyPI.
#                        js-legacy-v* / py-legacy-v* publish the deprecation shims
#                        under the old names (after the release they point at).
# npm needs the NPM_TOKEN secret (granular token for the @omnia-voice scope);
# PyPI uses trusted publishing (configure this repo as a publisher for the
# errorbar-tracing AND omnia-tracing projects on pypi.org — no token here).
on:
  push:
    tags:
      - "js-v*"
      - "py-v*"
      # Deprecation shims under the OLD names (@omnia-voice/tracing,
      # omnia-tracing): tag AFTER the js-v* / py-v* release they point at.
      - "js-legacy-v*"
      - "py-legacy-v*"

jobs:
  npm:
    if: startsWith(github.ref_name, 'js-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # --provenance signs the build against the workflow's OIDC identity.
      id-token: write
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    if: startsWith(github.ref_name, 'py-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # A job-level permissions block zeroes everything unlisted — without
      # contents:read the checkout can't see its own repo ("not found").
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - run: pip install -e . pytest && pytest tests/ -q
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist
  npm-legacy:
    if: startsWith(github.ref_name, 'js-legacy-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/typescript-legacy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm run build
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_LEGACY || secrets.NPM_TOKEN }}
  pypi-legacy:
    if: startsWith(github.ref_name, 'py-legacy-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/python-legacy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python-legacy/dist
