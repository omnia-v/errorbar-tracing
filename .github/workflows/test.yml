name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Interception checks against a REAL installed openai: shimmer marks
      # patched functions __wrapped. ESM runs through --import register —
      # the path that silently no-ops when the instrumentation package is
      # duplicated in the tree.
      - run: node test/cjs-check.cjs
      - run: cd test && node --import ../register.mjs esm-check.mjs
        env:
          OMNIA_API_KEY: ci
          OMNIA_OTLP_ENDPOINT: http://127.0.0.1:9

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest
      - run: pytest tests/ -q
      # The Anthropic-only scenario that broke v0: instrumentations must skip
      # libraries that aren't installed, and pick up ones that are.
      - run: |
          python -c "
          from omnia_tracing import setup
          t = setup(api_key='ci', endpoint='http://127.0.0.1:9')
          assert t.instrumented == [], t.instrumented
          t.shutdown()"
          pip install anthropic
          python -c "
          from omnia_tracing import setup
          t = setup(api_key='ci', endpoint='http://127.0.0.1:9')
          assert t.instrumented == ['anthropic'], t.instrumented
          t.shutdown()"
